name: Publish production images to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

env:
  DOCKER_BUILDKIT: "1"
  RUNNER_TOOL_CACHE: /runner-cache/tool-cache
  GOCACHE: /runner-cache/go-build
  GOMODCACHE: /runner-cache/go-mod
  NPM_CONFIG_CACHE: /runner-cache/npm
  PNPM_STORE_DIR: /runner-cache/pnpm
  YARN_CACHE_FOLDER: /runner-cache/yarn

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - name: Isolate Docker auth config per parallel job
        run: |
          DOCKER_CFG_DIR="${RUNNER_TEMP}/.docker-${{ strategy.job-index }}"
          mkdir -p "$DOCKER_CFG_DIR"
          echo "DOCKER_CONFIG=$DOCKER_CFG_DIR" >> "$GITHUB_ENV"

      - name: Check out the exact CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux Zitadel binary
        run: pnpm nx run @zitadel/api:build-linux

      - name: Build login application
        run: pnpm nx run @zitadel/login:build

      - name: Set up Docker Buildx (Host Docker Driver)
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Zitadel API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: final
          platforms: linux/amd64
          push: true
          build-args: |
            TARGETPLATFORM=linux/amd64
            BINARY=zitadel.local
          tags: |
            ghcr.io/matjerhub/zitadel-api:prod
            ghcr.io/matjerhub/zitadel-api:${{ github.sha }}

      - name: Build and publish login UI
        uses: docker/build-push-action@v6
        with:
          context: apps/login
          file: apps/login/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/matjerhub/sso-auth-login:prod
            ghcr.io/matjerhub/sso-auth-login:${{ github.sha }}

      - name: Prune old dangling build layers safely
        if: always()
        run: |
          docker image prune -f --filter "until=24h" 2>/dev/null || true
