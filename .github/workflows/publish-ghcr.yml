name: Publish production images to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ghcr-publish-${{ github.workflow }}-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the exact CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Linux Zitadel binary
        run: pnpm nx run @zitadel/api:build-linux

      - name: Build login application
        run: pnpm nx run @zitadel/login:build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Zitadel API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          target: final
          platforms: linux/amd64
          push: true
          build-args: |
            TARGETPLATFORM=linux/amd64
            BINARY=zitadel.local
          tags: |
            ghcr.io/matjeroapps/zitadel-api:prod
            ghcr.io/matjeroapps/zitadel-api:${{ github.sha }}
          cache-from: type=gha,scope=sso-auth-api
          cache-to: type=gha,mode=max,scope=sso-auth-api

      - name: Trigger Coolify Zitadel API deployment
        if: vars.COOLIFY_ZITADEL_API_RESOURCE_UUID != ''
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_API_URL" || { echo 'Missing variable COOLIFY_API_URL'; exit 1; }
          test -n "$COOLIFY_API_TOKEN" || { echo 'Missing secret COOLIFY_API_TOKEN'; exit 1; }
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_API_URL/api/v1/deploy?uuid=${{ vars.COOLIFY_ZITADEL_API_RESOURCE_UUID }}"

      - name: Build and publish login UI
        uses: docker/build-push-action@v6
        with:
          context: apps/login
          file: apps/login/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/matjeroapps/sso-auth-login:prod
            ghcr.io/matjeroapps/sso-auth-login:${{ github.sha }}
          cache-from: type=gha,scope=sso-auth-login
          cache-to: type=gha,mode=max,scope=sso-auth-login
      - name: Trigger Coolify SSO login deployment
        if: vars.COOLIFY_SSO_AUTH_LOGIN_RESOURCE_UUID != ''
        env:
          COOLIFY_API_URL: ${{ vars.COOLIFY_API_URL }}
          COOLIFY_API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$COOLIFY_API_URL" || { echo 'Missing variable COOLIFY_API_URL'; exit 1; }
          test -n "$COOLIFY_API_TOKEN" || { echo 'Missing secret COOLIFY_API_TOKEN'; exit 1; }
          curl --fail-with-body --silent --show-error --request POST \
            --header "Authorization: Bearer $COOLIFY_API_TOKEN" \
            "$COOLIFY_API_URL/api/v1/deploy?uuid=${{ vars.COOLIFY_SSO_AUTH_LOGIN_RESOURCE_UUID }}"
