name: Lint Test Build

on:
  workflow_call:
    inputs:
      node_version:
        required: true
        type: string
jobs:
  lint_test_build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: tree:0
      - name: Fetch main branch
        if: ${{ github.ref != 'refs/heads/main' }}
        run: git fetch origin main:main
      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node_version }}
          cache: "pnpm"
      - name: Set up Docker
        uses: docker/setup-docker-action@v4
        with:
          version: v28.3.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          version: v0.28.0
      - name: Set up Docker Compose
        uses: docker/setup-compose-action@v1
        with:
          version: v2.38.2
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Set SHAs for nx affected commands
        uses: nrwl/nx-set-shas@v4
      # Route wildcard localhost lookups through systemd-resolved for integration tests.
      - name: Restore systemd-resolved stub for *.localhost resolution
        run: |
          set -ex
          test -e /run/systemd/resolve/stub-resolv.conf
          sudo ln -sf /run/systemd/resolve/stub-resolv.conf /etc/resolv.conf
          getent hosts foo.integration.localhost
      - name: Lint, Test and Build
        env:
          NX_DAEMON: "false"
          NX_DISABLE_DB: "true"
          NX_NO_CLOUD: "true"
        run: pnpm nx affected --nxBail --targets lint test build --exclude @zitadel/docs
      - name: Check for uncommitted changes (Codegen mismatch)
        run: git diff --exit-code
      - name: Upload API Integration Test Race Logs
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: api-integration-test-race-logs
          path: |
            .artifacts/api-test-integration/race.log.*
      - name: Upload Functional UI Test Artifacts
        uses: actions/upload-artifact@v4
        if: failure() || cancelled()
        with:
          name: functional-ui-tests
          path: |
            tests/functional-ui/cypress/screenshots
            tests/functional-ui/cypress/videos
            tests/functional-ui/cypress/results
