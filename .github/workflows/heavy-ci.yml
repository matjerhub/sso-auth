name: Heavy CI

on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint_test_build:
    uses: ./.github/workflows/lint_test_build.yml
    permissions:
      contents: read
    with:
      node_version: "22"
      full_tests: true
      timeout_minutes: 45
